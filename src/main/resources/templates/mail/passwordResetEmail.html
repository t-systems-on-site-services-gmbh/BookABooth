<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title>Passwort zurücksetzen</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p>Moin <span th:text="${user.login}">onsite</span>,</p>
    <p>zum Zurücksetzen Ihres Passworts folgen Sie bitte dem unten stehenden Link:</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})" th:href="${url}" th:text="${url}">Login link</a>
    </p>
    <p>Bei Fragen kontaktieren Sie uns bitte unter <a th:href="@{|mailto:${supportEmail}|}" th:text="${supportEmail}">supportEmail</a>.</p>
    <p>
      <span>Mit freundlichen Grüßen</span>
      <br />
      <em>Jade Hochschule</em>
      <br />
      Zentrales Veranstaltungsmanagement
    </p>
  </body>
</html>
