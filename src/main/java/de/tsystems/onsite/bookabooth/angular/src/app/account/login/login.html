<main class="main">
  <!-- Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Anmeldung</h5>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="onSubmit()" class="m-5">
            <!-- Login Form mit Benutzername und Passwort-->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">Benutzername oder Passwort falsch!</div>
            <div class="form-group m-3">
              <label for="username">Benutzername</label>
              <input
                type="text"
                class="form-control"
                id="username"
                [(ngModel)]="username"
                name="username"
                placeholder="Ihr Benutzername"
                required
              />
            </div>
            <div class="form-group m-3">
              <label for="password">Passwort</label>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Ihr Passwort"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary m-3">Anmelden</button>
          </form>
          <div class="m-5">
            <div class="alert alert-warning" role="alert">
              <a [routerLink]="['/account/reset/request']" class="alert-link" data-cy="forgetYourPasswordSelector">
                Sie haben Ihr Passwort vergessen?
              </a>
            </div>
            <div class="alert alert-warning" role="alert">
              Sie haben noch keinen Zugang? <br />
              <a [routerLink]="['/register']" class="alert-link"> Registrieren Sie sich hier. </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
