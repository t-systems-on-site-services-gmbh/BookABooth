name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/bookabooth:{1}', github.repository_owner, github.ref_name) || format('ghcr.io/{0}/bookabooth:latest', github.repository_owner) }}
            ghcr.io/${{ github.repository_owner }}/bookabooth:${{ github.event.after }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.after }}

      - name: Post build cleanup
        run: docker builder prune --force
